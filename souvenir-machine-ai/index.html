<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Souvenir Machine (AI) — Audio-to-Image via Generative Model</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Souvenir Machine <span class="badge">AI version</span></h1>
        <p class="subtitle">
          Same 30-second audio capture as the no-ML engine, but the final
          image and a companion generated ambience both come from AI
          models instead of a hand-written renderer. See the README for
          how this differs from <code>souvenir-machine/</code>.
        </p>
      </header>

      <section id="controls">
        <button id="recordBtn">Start 30s recording</button>
        <div id="progress" class="progress" hidden><div id="progressBar"></div></div>
        <p id="status" role="status"></p>
      </section>

      <section id="result">
        <div id="imageHost"></div>
        <div id="soundHost"></div>
      </section>

      <aside id="promptPanel" class="prompt-panel" hidden></aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
